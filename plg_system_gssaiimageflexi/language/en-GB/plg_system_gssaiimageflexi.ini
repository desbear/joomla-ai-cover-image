PLG_SYSTEM_GSSAIIMAGEFLEXI="System - GSS AI Cover Image - FLEXIcontent image fields"
PLG_SYSTEM_GSSAIIMAGEFLEXI_XML_DESCRIPTION="Adds the AI button to image fields in the FLEXIcontent item form. Works with DB mode, folder mode and media manager mode, and with the intro and full images. API keys, category rules and the visual style are set in the System - GSS AI Cover Image plugin. Both plugins must be enabled."
PLG_SYSTEM_GSSAIIMAGEFLEXI_FIELDSET_DESC="Set API keys, category rules, ratio, maximum width and visual style in the System - GSS AI Cover Image plugin."
PLG_SYSTEM_GSSAIIMAGEFLEXI_ADMIN_LABEL="Administrator item form"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ADMIN_DESC="Show the AI button in the administrator FLEXIcontent item form."
PLG_SYSTEM_GSSAIIMAGEFLEXI_SITE_LABEL="Site item form"
PLG_SYSTEM_GSSAIIMAGEFLEXI_SITE_DESC="Show the AI button in the site FLEXIcontent item form."
PLG_SYSTEM_GSSAIIMAGEFLEXI_EXTRA_FIELDS_LABEL="Product tag fields"
PLG_SYSTEM_GSSAIIMAGEFLEXI_EXTRA_FIELDS_DESC="Names of fields to read besides FLEXIcontent tags, separated by commas, for example product,service,summary."
PLG_SYSTEM_GSSAIIMAGEFLEXI_CONTENT_IDS_LABEL="Editor IDs of the text"
PLG_SYSTEM_GSSAIIMAGEFLEXI_CONTENT_IDS_DESC="Element IDs of the text editors, separated by commas. The first one with content is used. The default jform_text is FLEXIcontent's description field."
PLG_SYSTEM_GSSAIIMAGEFLEXI_FORMAT_LABEL="File format"
PLG_SYSTEM_GSSAIIMAGEFLEXI_FORMAT_DESC="Format stored in FLEXIcontent image fields. Older FLEXIcontent versions cannot make thumbnails of WebP, so JPEG is recommended."
PLG_SYSTEM_GSSAIIMAGEFLEXI_FORMAT_CORE="Same as the core plugin"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_CORE="Enable the System - GSS AI Cover Image plugin first."
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_COMPONENT="FLEXIcontent is not installed or not enabled."
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_FIELD="This FLEXIcontent image field was not found."
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_ITEM="This item could not be identified. Save the item and try again."
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_FOLDER="The image folder set in FLEXIcontent cannot be used. Check the field or component settings."
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_INTROFULL="This field shows the intro or full image. Use the button next to the intro image or full image field."
