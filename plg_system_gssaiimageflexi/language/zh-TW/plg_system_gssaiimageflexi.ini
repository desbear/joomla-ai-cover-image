PLG_SYSTEM_GSSAIIMAGEFLEXI="系統 - GSS AI 主題圖片 - FLEXIcontent 圖片欄位"
PLG_SYSTEM_GSSAIIMAGEFLEXI_XML_DESCRIPTION="在 FLEXIcontent 項目編輯畫面的圖片欄位加上「AI 生圖」按鈕，支援資料庫模式、資料夾模式與媒體管理模式，也包含前言與全文圖片。API 金鑰、分類規則與視覺風格都在「系統 - GSS AI 主題圖片」外掛中設定，兩個外掛都要啟用。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_FIELDSET_DESC="API 金鑰、分類規則、比例、最大寬度與視覺風格請到「系統 - GSS AI 主題圖片」外掛設定。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ADMIN_LABEL="後台項目編輯"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ADMIN_DESC="在後台的 FLEXIcontent 項目編輯畫面顯示 AI 生圖按鈕。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_SITE_LABEL="前台項目編輯"
PLG_SYSTEM_GSSAIIMAGEFLEXI_SITE_DESC="在前台的 FLEXIcontent 項目編輯畫面顯示 AI 生圖按鈕。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_EXTRA_FIELDS_LABEL="產品標籤欄位"
PLG_SYSTEM_GSSAIIMAGEFLEXI_EXTRA_FIELDS_DESC="除了 FLEXIcontent 標籤之外，還要一併參考的欄位名稱，以逗號分隔，例如 product,service,summary。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_CONTENT_IDS_LABEL="內文編輯器 ID"
PLG_SYSTEM_GSSAIIMAGEFLEXI_CONTENT_IDS_DESC="內文編輯器的元素 ID，以逗號分隔，會使用第一個有內容的。預設的 jform_text 是 FLEXIcontent 的說明欄位。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_FORMAT_LABEL="檔案格式"
PLG_SYSTEM_GSSAIIMAGEFLEXI_FORMAT_DESC="存入 FLEXIcontent 圖片欄位的格式。較舊的 FLEXIcontent 無法替 WebP 產生縮圖，建議使用 JPEG。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_FORMAT_CORE="與核心外掛相同"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_CORE="請先啟用「系統 - GSS AI 主題圖片」外掛。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_COMPONENT="FLEXIcontent 尚未安裝或啟用。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_FIELD="找不到這個 FLEXIcontent 圖片欄位。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_ITEM="無法辨識這個項目，請先儲存項目後再試一次。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_FOLDER="FLEXIcontent 的圖片資料夾設定無法使用，請檢查欄位或元件設定。"
PLG_SYSTEM_GSSAIIMAGEFLEXI_ERR_INTROFULL="這個欄位顯示的是前言或全文圖片，請改用前言圖片或全文圖片欄位旁的按鈕。"
