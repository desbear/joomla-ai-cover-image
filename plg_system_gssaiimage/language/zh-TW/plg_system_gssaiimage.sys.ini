PLG_SYSTEM_GSSAIIMAGE_XML_DESCRIPTION="依文章標題、內文與產品標籤，用 OpenAI 或 Gemini Nano Banana 產生文章主題圖片。文章編輯畫面的圖片欄位旁會出現「AI 生圖」按鈕，產生後可以繼續提出修改需求再重新產生。可依分類設定額外的 prompt、比例與最大寬度。FLEXIcontent 圖片欄位請另外啟用「GSS AI 主題圖片 - FLEXIcontent」外掛。需要 PHP 8.1 以上與 GD。"
