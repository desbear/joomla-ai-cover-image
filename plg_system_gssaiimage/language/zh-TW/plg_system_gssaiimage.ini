; Editor reference images
PLG_SYSTEM_GSSAIIMAGE_ALLOW_USER_REFERENCES_LABEL="編輯者可提供參考圖"
PLG_SYSTEM_GSSAIIMAGE_ALLOW_USER_REFERENCES_DESC="開啟時，編輯者可以在面板中加入最多 3 張自己的參考圖，隨產生要求一起送給模型。參考圖只在該次要求期間存在，不會存到網站，面板關閉後就清除。"
PLG_SYSTEM_GSSAIIMAGE_ERR_REF_COUNT="最多只能提供 %d 張參考圖。"
PLG_SYSTEM_GSSAIIMAGE_ERR_REF_SIZE="參考圖太大，請改用較小的圖片。"
PLG_SYSTEM_GSSAIIMAGE_ERR_REF_INVALID="參考圖無法讀取，請改用 JPEG、PNG 或 WebP 圖片。"
PLG_SYSTEM_GSSAIIMAGE_UI_REFS_LABEL="參考圖片（最多 %s 張）"
PLG_SYSTEM_GSSAIIMAGE_UI_REFS_HINT="可選擇、拖曳或貼上圖片。關閉面板後會清除，不會存到網站。"
PLG_SYSTEM_GSSAIIMAGE_UI_REFS_ADD="加入圖片"
PLG_SYSTEM_GSSAIIMAGE_UI_REFS_REMOVE="移除這張參考圖"
