PLG_SYSTEM_GSSAIIMAGE_SKILL_UPLOAD_TITLE="上傳自己的 skill"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_KIND_STYLES="多種風格"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_KIND_STYLE="單一風格"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_KIND_TEMPLATES="提示詞模板"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_KIND_METHOD="提示詞方法"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_GLEBIS_GPT_IMAGE_2="二十多種現成的風格預設，例如線稿、藍圖、水墨、孔版印刷、包浩斯、等距視角。語言模型會挑一種最適合文章的，也可以在補充需求中指定，例如「用 blueprint 風格」。"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_CONARDLI_GPT_IMAGE_2="中文的結構化提示詞模板，這裡收錄封面、橫幅主視覺、品牌海報與場景插畫幾類，加上提示詞撰寫指南。適合想要海報感或場景感的文章主圖。"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_AGRICIDANIEL_BANANA="把需求整理成視覺簡報再寫成提示詞的方法，強調構圖、光線與該保留和該放開的元素。沒有固定的視覺風格，適合想要構圖嚴謹但不限定品牌調性時使用。"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_CHARLIE947_WHITEBOARD="像拍下一面白板或筆記本的手繪資訊圖，用麥克筆與螢光筆的筆觸。原本的設計包含手寫文字，搭配「圖中文字」設為無文字時只會保留手繪圖形。"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_DAVENDRA_GO_BANANAS="偏攝影與產品行銷的提示詞寫法，涵蓋鏡頭、光線、材質與常見用途的範例。適合想要寫實照片感的主圖。"
PLG_SYSTEM_GSSAIIMAGE_ERR_CATALOG_FETCH="無法從 GitHub 取回「%s」的文件。請確認主機可以連到 raw.githubusercontent.com，稍後再試。"
