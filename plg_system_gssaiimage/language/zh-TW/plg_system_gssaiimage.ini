; Open WebUI
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_OPENWEBUI="Open WebUI"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_NOTE_LABEL="Open WebUI"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_NOTE_DESC="透過你自己架設的 Open WebUI 伺服器，使用它已經接好的生圖模型與語言模型。管理員需先在 Open WebUI 的「管理員設定、圖片」啟用圖片產生並接上一個生圖服務（OpenAI、Gemini、ComfyUI、Automatic1111 等）。需要 Open WebUI 0.6.35 以上才能附上參考圖與修改既有圖片。"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_BASE_URL_LABEL="伺服器位址"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_BASE_URL_DESC="Open WebUI 的網址，例如 https://ai.example.com。貼上含 /api/v1 的位址也可以。金鑰只會送到這個位址。"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_KEY_LABEL="Open WebUI API 金鑰"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_KEY_DESC="在 Open WebUI 的「設定、帳號、API 金鑰」建立。這個帳號需要有生圖的權限。金鑰只存在伺服器，不會送到瀏覽器。"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_IMAGE_MODEL_DESC="填 Open WebUI 管理員設定的生圖模型代號，留空使用伺服器預設的生圖模型。請注意：只送 prompt 的產生一律使用伺服器設定的模型，這裡填的模型只在附上參考圖或修改既有圖片時生效。"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_TEXT_MODEL_LABEL="語言模型"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_TEXT_MODEL_DESC="用來產生畫面構想的語言模型，填 Open WebUI 模型清單裡的模型代號，例如 gpt-4o-mini。留空時不產生畫面構想，直接把文章摘要交給生圖模型。"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_DELETE_LABEL="取回後刪除伺服器上的檔案"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_DELETE_DESC="Open WebUI 會把每張產生的圖存在金鑰所屬帳號的檔案裡。開啟時，外掛取回圖片後會刪除那個檔案，避免草稿不斷累積。"
PLG_SYSTEM_GSSAIIMAGE_ERR_PROVIDER_DENIED="%s 不允許這個金鑰使用這項功能。可能是帳號沒有生圖權限，或伺服器沒有開放。請聯絡網站管理員。"
PLG_SYSTEM_GSSAIIMAGE_ERR_NO_EDIT="這個生圖服務沒有開放修改既有圖片。請改選「重新構圖」再試一次。"
PLG_SYSTEM_GSSAIIMAGE_ERR_NO_TEXT_MODEL="尚未設定語言模型。"
PLG_SYSTEM_GSSAIIMAGE_NOTICE_IMAGES_IGNORED="這個生圖服務這次無法採用參考圖，圖片沒有參考它們。"

; Style sources and per-image style choice
PLG_SYSTEM_GSSAIIMAGE_ALLOW_STYLE_SWITCH_LABEL="編輯者可切換風格"
PLG_SYSTEM_GSSAIIMAGE_ALLOW_STYLE_SWITCH_DESC="開啟時，編輯者可以在面板中從內建風格與已安裝的 skill 之中選擇這張圖要用的風格。關閉時一律使用上方選用的預設風格。"
