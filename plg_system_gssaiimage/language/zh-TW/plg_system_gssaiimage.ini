PLG_SYSTEM_GSSAIIMAGE_SKILL_CATALOG_HINT="GitHub 上公開、授權明確的生圖 skill。安裝時只取回已審閱過的那一版文字文件，不含任何程式。安裝後會出現在上方的清單。"
