PLG_SYSTEM_GSSAIIMAGE_UI_REFS_USED="參考圖 %s 張"
PLG_SYSTEM_GSSAIIMAGE_UI_REFS_ITEM="參考圖 %s"

; Layers
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_FIELDS="圖片欄位設定"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_FIELDS_DESC="第二層：圖片欄位。替個別的圖片欄位指定比例、最大寬度與額外的 prompt，會蓋過「輸出」與「視覺風格」頁籤的預設值，再被分類規則蓋過。設定依序為：全部預設、圖片欄位、分類、編輯者在面板中的調整。留空的項目沿用下一層。額外的 prompt 不互相取代，圖片欄位與分類的會一起套用。"
PLG_SYSTEM_GSSAIIMAGE_FIELD_RULES_LABEL="圖片欄位"
PLG_SYSTEM_GSSAIIMAGE_FIELD_RULES_DESC="由上往下比對，同一個欄位出現在多列時使用最上面那一列。"
PLG_SYSTEM_GSSAIIMAGE_FIELD_NAMES_LABEL="欄位名稱"
PLG_SYSTEM_GSSAIIMAGE_FIELD_NAMES_DESC="這一列適用的圖片欄位，多個以逗號分隔。前言圖片是 image_intro，全文圖片是 image_fulltext。自訂欄位與 FLEXIcontent 欄位填欄位的名稱，例如 og_image。面板的「套用設定」會顯示目前欄位的名稱。"
PLG_SYSTEM_GSSAIIMAGE_FIELD_PROMPT_DESC="這個欄位的圖片要額外遵守的方向，例如「社群分享用的圖，主體集中在畫面中央」。"
PLG_SYSTEM_GSSAIIMAGE_RULE_FIELDS_LABEL="適用的圖片欄位"
PLG_SYSTEM_GSSAIIMAGE_RULE_FIELDS_DESC="留空表示這條規則適用於所有圖片欄位。填入欄位名稱後只適用於那些欄位，多個以逗號分隔。例如 OG 圖片需要固定比例時，可以另外加一條只適用於 og_image 的規則。"
PLG_SYSTEM_GSSAIIMAGE_UI_APPLIES="套用設定"
PLG_SYSTEM_GSSAIIMAGE_UI_FIELD="欄位"
PLG_SYSTEM_GSSAIIMAGE_UI_FIELD_NONE="這個欄位沒有個別設定"
PLG_SYSTEM_GSSAIIMAGE_UI_FIELD_HINT="已套用這個欄位的個別設定"
PLG_SYSTEM_GSSAIIMAGE_UI_FIELD_PROMPT="欄位的額外 prompt"
PLG_SYSTEM_GSSAIIMAGE_UI_CATEGORY="分類"
PLG_SYSTEM_GSSAIIMAGE_UI_CATEGORY_NONE="這個分類沒有規則"
PLG_SYSTEM_GSSAIIMAGE_UI_FROM_DEFAULT="來自全部預設"
PLG_SYSTEM_GSSAIIMAGE_UI_FROM_FIELD="來自圖片欄位設定"
PLG_SYSTEM_GSSAIIMAGE_UI_FROM_CATEGORY="來自分類規則"
PLG_SYSTEM_GSSAIIMAGE_UI_FROM_YOU="你在這裡的調整"

; Style skills
PLG_SYSTEM_GSSAIIMAGE_STYLE_SKILL_LABEL="風格 Skill"
PLG_SYSTEM_GSSAIIMAGE_STYLE_SKILL_DESC="選擇預設的風格，並管理可用的風格。內建的編輯插畫風格是預設值。可以從推薦來源安裝其他 skill，或上傳自己的 zip 壓縮檔。安裝、上傳與刪除會立即生效，預設選用哪一個則要儲存設定後才生效。"
PLG_SYSTEM_GSSAIIMAGE_SKILL_BUILTIN="內建編輯插畫風格"
PLG_SYSTEM_GSSAIIMAGE_SKILL_BUILTIN_DESC="不屬於任何品牌的通用風格：淺色或深色漸層底、細緻噪點、克制的配色、平面向量與紙張拼貼。品牌色可在下方「品牌色」填入；要用自家的視覺語言，請安裝或上傳 skill。"
PLG_SYSTEM_GSSAIIMAGE_SKILL_UPLOAD="上傳 skill 壓縮檔"
PLG_SYSTEM_GSSAIIMAGE_SKILL_UPLOAD_HINT="選擇 zip 檔，或把檔案拖曳到這裡。壓縮檔內需要有 SKILL.md。這台主機的上傳上限是 %s MB。同名的 skill 會被新的取代。"
PLG_SYSTEM_GSSAIIMAGE_SKILL_UPLOADING="上傳中…"
PLG_SYSTEM_GSSAIIMAGE_SKILL_DELETE="刪除"
PLG_SYSTEM_GSSAIIMAGE_SKILL_DELETE_CONFIRM="確定要刪除「%s」嗎？刪除後無法復原。"
