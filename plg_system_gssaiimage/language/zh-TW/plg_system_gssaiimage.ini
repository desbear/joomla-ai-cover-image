PLG_SYSTEM_GSSAIIMAGE="系統 - GSS AI 主題圖片（核心與 Joomla 圖片欄位）"
PLG_SYSTEM_GSSAIIMAGE_XML_DESCRIPTION="依文章標題、內文與產品標籤，用 OpenAI 或 Gemini Nano Banana 產生文章主題圖片。文章編輯畫面的圖片欄位旁會出現「AI 生圖」按鈕，產生後可以繼續提出修改需求再重新產生。可依分類設定額外的 prompt、比例與最大寬度。FLEXIcontent 圖片欄位請另外啟用「GSS AI 主題圖片 - FLEXIcontent」外掛。需要 PHP 8.1 以上與 GD。"

; Fieldsets
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_API="API 與服務"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_RULES="分類規則"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_RULES_DESC="第三層：分類。替不同分類指定額外的 prompt、比例與最大寬度，會蓋過預設值與圖片欄位的設定。文章所在的分類有規則時用該規則，沒有時往上找父分類中「套用到子分類」的規則。規則可以只適用於指定的圖片欄位。FLEXIcontent 與 Joomla 文章共用同一份分類。"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_OUTPUT="輸出"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_OUTPUT_DESC="第一層：全部預設。圖片欄位與分類都沒有設定時使用的尺寸，以及圖片的格式與儲存位置。"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_STYLE="視覺風格"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_STYLE_DESC="選擇圖片的視覺風格。預設是內建的編輯插畫風格，也可以從推薦來源安裝其他 skill，或上傳自己的 skill 壓縮檔。下方其他設定是在所選風格之上做調整。"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_NATIVE="Joomla 圖片欄位"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_NATIVE_DESC="文章的前言圖片、全文圖片，以及「媒體」類型的自訂欄位。"

; API
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_OPENAI="OpenAI"
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_GEMINI="Gemini Nano Banana"
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_DEFAULT_LABEL="預設服務"
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_DEFAULT_DESC="沒有在圖片欄位設定或分類規則中指定時使用的生圖服務。所選服務尚未設定完成時，會改用已設定好的那一個。"
PLG_SYSTEM_GSSAIIMAGE_ALLOW_PROVIDER_SWITCH_LABEL="編輯者可切換服務"
PLG_SYSTEM_GSSAIIMAGE_ALLOW_PROVIDER_SWITCH_DESC="開啟時，編輯者可以在面板中選擇用哪一個已設定好的生圖服務。"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_NOTE_LABEL="OpenAI"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_NOTE_DESC="使用 OpenAI Images API（gpt-image 系列）。金鑰在 https://platform.openai.com/api-keys 建立，帳號需先儲值並完成組織驗證才能使用 gpt-image 模型。"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_KEY_LABEL="OpenAI API 金鑰"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_KEY_DESC="在 https://platform.openai.com/api-keys 建立，以 sk- 開頭。金鑰只存在伺服器，不會送到瀏覽器。"
PLG_SYSTEM_GSSAIIMAGE_IMAGE_MODEL_LABEL="生圖模型"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_IMAGE_MODEL_DESC="可從建議清單選擇，或直接輸入模型名稱。"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_QUALITY_LABEL="品質"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_QUALITY_DESC="品質越高，費用越高、等待越久。"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_LOW="低（最快、最省）"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_MEDIUM="中"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_HIGH="高"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_AUTO="由模型決定"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_BASE_URL_LABEL="API 位址"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_BASE_URL_DESC="留空使用 https://api.openai.com/v1。透過相容的代理或閘道時才需要填寫。"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_NOTE_LABEL="Gemini Nano Banana"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_NOTE_DESC="使用 Gemini API 的圖片模型（Nano Banana）。金鑰在 Google AI Studio（https://aistudio.google.com/apikey）免費建立；生圖需要已啟用計費的專案。"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_KEY_LABEL="Gemini API 金鑰"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_KEY_DESC="在 Google AI Studio（https://aistudio.google.com/apikey）建立。金鑰只存在伺服器，不會送到瀏覽器。"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_IMAGE_MODEL_DESC="可從建議清單選擇，或直接輸入模型名稱。"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_SIZE_LABEL="輸出解析度"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_SIZE_DESC="只有 Pro 圖片模型支援。最大寬度超過 1024 時建議選 2K。"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_SIZE_DEFAULT="模型預設"
PLG_SYSTEM_GSSAIIMAGE_LIMITS_NOTE_LABEL="限制"
PLG_SYSTEM_GSSAIIMAGE_TIMEOUT_LABEL="等待秒數上限"
PLG_SYSTEM_GSSAIIMAGE_TIMEOUT_DESC="等待生圖服務回應的最長時間，上限 300 秒。主機或反向代理的逾時設定若比這個短，會先被它們中斷。"
PLG_SYSTEM_GSSAIIMAGE_RATE_LIMIT_LABEL="每人每小時次數上限"
PLG_SYSTEM_GSSAIIMAGE_RATE_LIMIT_DESC="每位編輯者一小時內最多可產生的次數，套用到欄位的次數也用同一個上限。紀錄跟著使用者帳號，重新登入不會歸零。每位編輯者同一時間只能產生一張。填 0 表示不限制次數。"

; Rules
PLG_SYSTEM_GSSAIIMAGE_RULES_LABEL="規則"
PLG_SYSTEM_GSSAIIMAGE_RULES_DESC="由上往下比對。同一個分類有多條規則時，優先使用指定了該圖片欄位的規則，其次是最上面那一條適用所有欄位的規則。"
PLG_SYSTEM_GSSAIIMAGE_RULE_CATEGORY_LABEL="分類"
PLG_SYSTEM_GSSAIIMAGE_RULE_CATEGORY_DESC="這條規則適用的分類，可以選多個。"
PLG_SYSTEM_GSSAIIMAGE_RULE_CHILDREN_LABEL="套用到子分類"
PLG_SYSTEM_GSSAIIMAGE_RULE_CHILDREN_DESC="開啟時，沒有自己規則的子分類也會使用這條規則。"
PLG_SYSTEM_GSSAIIMAGE_RULE_PROMPT_LABEL="額外的 prompt"
PLG_SYSTEM_GSSAIIMAGE_RULE_PROMPT_DESC="這個分類的圖片要額外遵守的方向，例如「客戶故事：以一隻灰階的手與文件表現導入成果，不出現人臉」。中文或英文皆可。"
PLG_SYSTEM_GSSAIIMAGE_RULE_RATIO_DESC="留空沿用下一層的比例。可輸入 16:9 或 1200x630 這樣的寫法。"
PLG_SYSTEM_GSSAIIMAGE_RULE_MAX_WIDTH_DESC="留空沿用下一層的最大寬度。"
PLG_SYSTEM_GSSAIIMAGE_RULE_INHERIT="沿用下一層"
PLG_SYSTEM_GSSAIIMAGE_RULE_INHERIT_DESC="選「沿用下一層」時，使用圖片欄位設定或全部預設的值。"

; Output
PLG_SYSTEM_GSSAIIMAGE_RATIO_LABEL="比例"
PLG_SYSTEM_GSSAIIMAGE_RATIO_DESC="圖片的寬高比。可輸入 16:9 或 1200x630 這樣的寫法。模型不支援的比例會先以最接近的比例產生，再從中央裁切。"
PLG_SYSTEM_GSSAIIMAGE_MAX_WIDTH_LABEL="最大寬度（px）"
PLG_SYSTEM_GSSAIIMAGE_MAX_WIDTH_DESC="圖片超過這個寬度時會縮小。產生的圖片比這個寬度小時維持原尺寸，不會放大。"
PLG_SYSTEM_GSSAIIMAGE_ALLOW_SIZE_OVERRIDE_LABEL="編輯者可調整尺寸"
PLG_SYSTEM_GSSAIIMAGE_ALLOW_SIZE_OVERRIDE_DESC="開啟時，編輯者可以在面板中改比例與最大寬度，這是蓋過所有設定的最上層。關閉時一律使用預設、圖片欄位與分類的設定。"
PLG_SYSTEM_GSSAIIMAGE_FORMAT_LABEL="檔案格式"
PLG_SYSTEM_GSSAIIMAGE_FORMAT_DESC="主機的 GD 不支援 WebP 時會自動改存 JPEG。"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_LABEL="壓縮品質"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_DESC="WebP 與 JPEG 的壓縮品質，40 到 100。"
PLG_SYSTEM_GSSAIIMAGE_SAVE_FOLDER_LABEL="儲存資料夾"
PLG_SYSTEM_GSSAIIMAGE_SAVE_FOLDER_DESC="相對於網站根目錄，必須是 images 或它底下的資料夾，否則會改用 images/ai-generated。套用的圖片會依年月存在這個資料夾，尚未套用的草稿存在其中的 _drafts。"
PLG_SYSTEM_GSSAIIMAGE_DRAFT_TTL_LABEL="草稿保留時數"
PLG_SYSTEM_GSSAIIMAGE_DRAFT_TTL_DESC="套用到欄位時，草稿會立即刪除。沒有套用的草稿，超過這個時數後會在下次產生圖片時刪除。"

; Style
PLG_SYSTEM_GSSAIIMAGE_LAYOUT_LABEL="版面模式"
PLG_SYSTEM_GSSAIIMAGE_LAYOUT_DESC="「自動」會依文章內容選擇最合適的模式。使用上傳的 skill 時，會對應到該 skill 最接近的版面模式。"
PLG_SYSTEM_GSSAIIMAGE_TEXT_MODE_LABEL="圖中文字"
PLG_SYSTEM_GSSAIIMAGE_TEXT_MODE_DESC="建議使用無文字。模型畫繁體中文時可能出現錯字，放入標題後請逐字檢查。"
PLG_SYSTEM_GSSAIIMAGE_STYLE_COLORS_LABEL="品牌色"
PLG_SYSTEM_GSSAIIMAGE_STYLE_COLORS_DESC="內建風格使用的顏色，填十六進位色碼，以逗號分隔，最多 8 個，例如 #1A5BFF, #7C3AED。留空時由模型自行選用克制的配色。使用 skill 時以 skill 的配色為準。"
PLG_SYSTEM_GSSAIIMAGE_STYLE_BUILTIN="內建風格"
PLG_SYSTEM_GSSAIIMAGE_USE_REFERENCES_LABEL="附上風格參考圖"
PLG_SYSTEM_GSSAIIMAGE_USE_REFERENCES_DESC="把風格參考圖一起送給模型，風格會更一致，費用與等待時間略增。使用安裝的 skill 時，參考圖取自 skill 內的圖片；使用內建風格時，取自下方的參考圖資料夾，資料夾留空就不附參考圖。"
PLG_SYSTEM_GSSAIIMAGE_MAX_REFERENCES_LABEL="參考圖張數"
PLG_SYSTEM_GSSAIIMAGE_MAX_REFERENCES_DESC="每次最多附上幾張。"
PLG_SYSTEM_GSSAIIMAGE_REFERENCE_FOLDER_LABEL="自訂參考圖資料夾"
PLG_SYSTEM_GSSAIIMAGE_REFERENCE_FOLDER_DESC="網站 images 底下的資料夾，例如 images/style-reference。放幾張符合你們風格的範例圖，依檔名排序取用。填寫後也會取代 skill 自帶的參考圖。"
PLG_SYSTEM_GSSAIIMAGE_STYLE_PROMPT_LABEL="補充風格方向"
PLG_SYSTEM_GSSAIIMAGE_STYLE_PROMPT_DESC="加在所選風格之後，所有分類都會套用。"
PLG_SYSTEM_GSSAIIMAGE_AVOID_LABEL="額外避免的元素"
PLG_SYSTEM_GSSAIIMAGE_AVOID_DESC="加在所選風格的避免清單之後。"
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_NOTE_LABEL="畫面構想"
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_NOTE_DESC="先請語言模型讀完文章，提出一個清楚的視覺隱喻，再交給生圖模型。這樣圖片比較會表達文章的重點，而不是照字面畫出內文。使用上傳的 skill 時，語言模型會依 skill 的內容撰寫 prompt。"
PLG_SYSTEM_GSSAIIMAGE_USE_CONCEPT_LABEL="先產生畫面構想"
PLG_SYSTEM_GSSAIIMAGE_USE_CONCEPT_DESC="關閉時直接把文章摘要交給生圖模型。使用上傳的 skill 時，關閉會把 skill 的內容直接交給生圖模型，效果通常較差。"
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_PROVIDER_LABEL="構想使用的服務"
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_PROVIDER_DESC="「與生圖相同」會使用當次生圖的服務。"
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_PROVIDER_SAME="與生圖相同"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_TEXT_MODEL_LABEL="OpenAI 語言模型"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_TEXT_MODEL_LABEL="Gemini 語言模型"
PLG_SYSTEM_GSSAIIMAGE_TEXT_MODEL_DESC="用來產生畫面構想的語言模型名稱。"
PLG_SYSTEM_GSSAIIMAGE_MAX_CONTENT_LABEL="內文字數上限"
PLG_SYSTEM_GSSAIIMAGE_MAX_CONTENT_DESC="送給模型的內文最多幾個字，超過的部分會截斷。"

; Native
PLG_SYSTEM_GSSAIIMAGE_NATIVE_ADMIN_LABEL="後台文章編輯"
PLG_SYSTEM_GSSAIIMAGE_NATIVE_ADMIN_DESC="在後台的文章編輯畫面顯示 AI 生圖按鈕。"
PLG_SYSTEM_GSSAIIMAGE_NATIVE_SITE_LABEL="前台文章編輯"
PLG_SYSTEM_GSSAIIMAGE_NATIVE_SITE_DESC="在前台的文章編輯畫面顯示 AI 生圖按鈕。"
PLG_SYSTEM_GSSAIIMAGE_EXTRA_FIELDS_LABEL="產品標籤欄位"
PLG_SYSTEM_GSSAIIMAGE_EXTRA_FIELDS_DESC="除了 Joomla 標籤之外，還要一併參考的自訂欄位名稱，以逗號分隔，例如 product,solution。"

