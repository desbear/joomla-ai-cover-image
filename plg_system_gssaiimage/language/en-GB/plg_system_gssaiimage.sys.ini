PLG_SYSTEM_GSSAIIMAGE="System - GSS AI Cover Image (core and Joomla image fields)"
PLG_SYSTEM_GSSAIIMAGE_XML_DESCRIPTION="Creates cover images from an article's title, text and product tags, using OpenAI or Gemini Nano Banana. An AI button appears next to image fields in the article form. After an image is made you can ask for changes and generate again. Each category can have its own extra prompt, aspect ratio and maximum width. For FLEXIcontent image fields, also enable the GSS AI Cover Image - FLEXIcontent plugin. Requires PHP 8.1 or later and GD."
