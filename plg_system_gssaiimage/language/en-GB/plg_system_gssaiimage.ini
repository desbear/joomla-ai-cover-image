PLG_SYSTEM_GSSAIIMAGE_CATALOG_KIND_METHOD="Prompt method"
PLG_SYSTEM_GSSAIIMAGE_CATALOG_GLEBIS_GPT_IMAGE_2="More than twenty ready style presets, such as line art, blueprint, ink wash, risograph, Bauhaus and isometric. The language model picks the one that suits the article, or name one in your request, for example: use the blueprint style."
PLG_SYSTEM_GSSAIIMAGE_CATALOG_CONARDLI_GPT_IMAGE_2="Structured prompt templates in Chinese. This selection covers editorial covers, hero banners, brand posters and scene illustrations, with a guide to prompt writing. For cover images with the feel of a poster or a scene."
PLG_SYSTEM_GSSAIIMAGE_CATALOG_AGRICIDANIEL_BANANA="A method that turns a request into a visual brief and then into a prompt, with attention to composition, light, and what to lock and what to leave free. It has no visual style of its own. For well-composed images that are not tied to a brand."
PLG_SYSTEM_GSSAIIMAGE_CATALOG_CHARLIE947_WHITEBOARD="A hand-drawn infographic that looks like a photograph of a whiteboard or notebook, in marker and highlighter. It was designed with handwritten text. With text in the image set to none, only the hand-drawn shapes remain."
PLG_SYSTEM_GSSAIIMAGE_CATALOG_DAVENDRA_GO_BANANAS="Prompt writing for photography and product marketing: lenses, light, materials, and examples by use. For cover images that should look like a real photograph."
