PLG_SYSTEM_GSSAIIMAGE="System - GSS AI Cover Image (core and Joomla image fields)"
PLG_SYSTEM_GSSAIIMAGE_XML_DESCRIPTION="Creates cover images from an article's title, text and product tags, using OpenAI or Gemini Nano Banana. An AI button appears next to image fields in the article form. After an image is made you can ask for changes and generate again. Each category can have its own extra prompt, aspect ratio and maximum width. For FLEXIcontent image fields, also enable the GSS AI Cover Image - FLEXIcontent plugin. Requires PHP 8.1 or later and GD."

; Fieldsets
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_API="API and services"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_RULES="Category rules"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_RULES_DESC="Third layer: categories. Give categories their own extra prompt, aspect ratio and maximum width. They override the defaults and the image field settings. An article uses the rule of its own category, or else the nearest parent rule that applies to child categories. A rule can be limited to named image fields. FLEXIcontent and Joomla articles share the same categories."
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_OUTPUT="Output"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_OUTPUT_DESC="First layer: defaults. The size used when neither the image field nor the category sets one, and the format and location of the files."
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_STYLE="Visual style"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_STYLE_DESC="Choose the visual style of the images. The default is the built-in editorial illustration style. You can install other skills from the list of sources, or upload a skill of your own as a zip package. The other settings below adjust the chosen style."
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_NATIVE="Joomla image fields"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_NATIVE_DESC="Intro image, full article image and custom fields of type Media."

; API
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_OPENAI="OpenAI"
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_GEMINI="Gemini Nano Banana"
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_DEFAULT_LABEL="Default service"
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_DEFAULT_DESC="The image service used when neither the image field settings nor a category rule names one. If it is not set up yet, a service that is set up is used."
PLG_SYSTEM_GSSAIIMAGE_ALLOW_PROVIDER_SWITCH_LABEL="Editors can switch service"
PLG_SYSTEM_GSSAIIMAGE_ALLOW_PROVIDER_SWITCH_DESC="When on, editors can choose among the image services that are set up."
PLG_SYSTEM_GSSAIIMAGE_OPENAI_NOTE_LABEL="OpenAI"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_NOTE_DESC="Uses the OpenAI Images API (gpt-image models). Create a key at https://platform.openai.com/api-keys. The account needs credit and completed organisation verification to use gpt-image models."
PLG_SYSTEM_GSSAIIMAGE_OPENAI_KEY_LABEL="OpenAI API key"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_KEY_DESC="Create one at https://platform.openai.com/api-keys; it starts with sk-. The key stays on the server and is never sent to the browser."
PLG_SYSTEM_GSSAIIMAGE_IMAGE_MODEL_LABEL="Image model"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_IMAGE_MODEL_DESC="Choose a suggestion or type a model name."
PLG_SYSTEM_GSSAIIMAGE_OPENAI_QUALITY_LABEL="Quality"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_QUALITY_DESC="Higher quality costs more and takes longer."
PLG_SYSTEM_GSSAIIMAGE_QUALITY_LOW="Low (fastest, cheapest)"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_MEDIUM="Medium"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_HIGH="High"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_AUTO="Let the model decide"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_BASE_URL_LABEL="API address"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_BASE_URL_DESC="Leave empty for https://api.openai.com/v1. Only needed behind a compatible proxy or gateway."
PLG_SYSTEM_GSSAIIMAGE_GEMINI_NOTE_LABEL="Gemini Nano Banana"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_NOTE_DESC="Uses the image models of the Gemini API (Nano Banana). Create a free key in Google AI Studio at https://aistudio.google.com/apikey; image generation needs a project with billing enabled."
PLG_SYSTEM_GSSAIIMAGE_GEMINI_KEY_LABEL="Gemini API key"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_KEY_DESC="Create one in Google AI Studio at https://aistudio.google.com/apikey. The key stays on the server and is never sent to the browser."
PLG_SYSTEM_GSSAIIMAGE_GEMINI_IMAGE_MODEL_DESC="Choose a suggestion or type a model name."
PLG_SYSTEM_GSSAIIMAGE_GEMINI_SIZE_LABEL="Output resolution"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_SIZE_DESC="Only the Pro image models support this. Choose 2K when the maximum width is above 1024."
PLG_SYSTEM_GSSAIIMAGE_GEMINI_SIZE_DEFAULT="Model default"
PLG_SYSTEM_GSSAIIMAGE_LIMITS_NOTE_LABEL="Limits"
PLG_SYSTEM_GSSAIIMAGE_TIMEOUT_LABEL="Longest wait (seconds)"
PLG_SYSTEM_GSSAIIMAGE_TIMEOUT_DESC="How long to wait for the image service, 300 seconds at most. A shorter timeout on the host or reverse proxy will cut the request off first."
PLG_SYSTEM_GSSAIIMAGE_RATE_LIMIT_LABEL="Generations per person per hour"
PLG_SYSTEM_GSSAIIMAGE_RATE_LIMIT_DESC="The most images one editor can generate in an hour. Applying to a field has the same limit. The count is kept with the user account, so signing in again does not reset it. An editor generates one image at a time. 0 means no limit on the count."

; Rules
PLG_SYSTEM_GSSAIIMAGE_RULES_LABEL="Rules"
PLG_SYSTEM_GSSAIIMAGE_RULES_DESC="Checked from top to bottom. When a category has several rules, a rule that names the image field comes first, then the first rule for every field."
PLG_SYSTEM_GSSAIIMAGE_RULE_CATEGORY_LABEL="Categories"
PLG_SYSTEM_GSSAIIMAGE_RULE_CATEGORY_DESC="The categories this rule applies to."
PLG_SYSTEM_GSSAIIMAGE_RULE_CHILDREN_LABEL="Apply to child categories"
PLG_SYSTEM_GSSAIIMAGE_RULE_CHILDREN_DESC="When on, child categories without a rule of their own use this rule."
PLG_SYSTEM_GSSAIIMAGE_RULE_PROMPT_LABEL="Extra prompt"
PLG_SYSTEM_GSSAIIMAGE_RULE_PROMPT_DESC="Direction that images in this category must also follow, for example: Customer stories show one grayscale hand with documents and never a face."
PLG_SYSTEM_GSSAIIMAGE_RULE_RATIO_DESC="Leave empty to keep the ratio of the layer below. Write it like 16:9 or 1200x630."
PLG_SYSTEM_GSSAIIMAGE_RULE_MAX_WIDTH_DESC="Leave empty to keep the maximum width of the layer below."
PLG_SYSTEM_GSSAIIMAGE_RULE_INHERIT="Keep the layer below"
PLG_SYSTEM_GSSAIIMAGE_RULE_INHERIT_DESC="Keep the layer below uses the value of the image field settings or the defaults."

; Output
PLG_SYSTEM_GSSAIIMAGE_RATIO_LABEL="Aspect ratio"
PLG_SYSTEM_GSSAIIMAGE_RATIO_DESC="Width to height. Write it like 16:9 or 1200x630. When the model cannot draw a ratio, the nearest one is drawn and cropped from the centre."
PLG_SYSTEM_GSSAIIMAGE_MAX_WIDTH_LABEL="Maximum width (px)"
PLG_SYSTEM_GSSAIIMAGE_MAX_WIDTH_DESC="Wider images are scaled down. Narrower images keep their size and are never enlarged."
PLG_SYSTEM_GSSAIIMAGE_ALLOW_SIZE_OVERRIDE_LABEL="Editors can change the size"
PLG_SYSTEM_GSSAIIMAGE_ALLOW_SIZE_OVERRIDE_DESC="When on, editors can change the ratio and maximum width in the panel. This is the top layer and overrides every setting. When off, the defaults, image field settings and category rules always apply."
PLG_SYSTEM_GSSAIIMAGE_FORMAT_LABEL="File format"
PLG_SYSTEM_GSSAIIMAGE_FORMAT_DESC="Saved as JPEG when the host's GD cannot write WebP."
PLG_SYSTEM_GSSAIIMAGE_QUALITY_LABEL="Compression quality"
PLG_SYSTEM_GSSAIIMAGE_QUALITY_DESC="For WebP and JPEG, 40 to 100."
PLG_SYSTEM_GSSAIIMAGE_SAVE_FOLDER_LABEL="Folder"
PLG_SYSTEM_GSSAIIMAGE_SAVE_FOLDER_DESC="Relative to the site root. It must be images or a folder inside it, otherwise images/ai-generated is used. Applied images are stored here by year and month. Drafts wait in its _drafts folder."
PLG_SYSTEM_GSSAIIMAGE_DRAFT_TTL_LABEL="Keep drafts (hours)"
PLG_SYSTEM_GSSAIIMAGE_DRAFT_TTL_DESC="Drafts are deleted as soon as one is applied to a field. Drafts that were never applied are deleted after this time, the next time an image is generated."

; Style
PLG_SYSTEM_GSSAIIMAGE_LAYOUT_LABEL="Layout mode"
PLG_SYSTEM_GSSAIIMAGE_LAYOUT_DESC="Automatic picks the mode that suits the article. With an uploaded skill, the nearest layout mode of that skill is used."
PLG_SYSTEM_GSSAIIMAGE_TEXT_MODE_LABEL="Text in the image"
PLG_SYSTEM_GSSAIIMAGE_TEXT_MODE_DESC="No text is recommended. Models can misspell Traditional Chinese, so check every character when the headline is included."
PLG_SYSTEM_GSSAIIMAGE_STYLE_COLORS_LABEL="Brand colours"
PLG_SYSTEM_GSSAIIMAGE_STYLE_COLORS_DESC="Colours for the built-in style, as hex codes separated by commas, up to 8, for example #1A5BFF, #7C3AED. When empty the model picks a restrained palette. A skill uses its own palette."
PLG_SYSTEM_GSSAIIMAGE_STYLE_BUILTIN="Built-in style"
PLG_SYSTEM_GSSAIIMAGE_USE_REFERENCES_LABEL="Send style reference images"
PLG_SYSTEM_GSSAIIMAGE_USE_REFERENCES_DESC="Sends style reference images with the prompt. Style is more consistent. Cost and waiting time rise a little. With an installed skill, the images come from the skill. With the built-in style, they come from the reference folder below; with no folder, none are sent."
PLG_SYSTEM_GSSAIIMAGE_MAX_REFERENCES_LABEL="Number of reference images"
PLG_SYSTEM_GSSAIIMAGE_MAX_REFERENCES_DESC="The most images sent with one request."
PLG_SYSTEM_GSSAIIMAGE_REFERENCE_FOLDER_LABEL="Own reference folder"
PLG_SYSTEM_GSSAIIMAGE_REFERENCE_FOLDER_DESC="A folder under the site's images folder, for example images/style-reference. Put a few example images of your style there; they are used in file name order. When set, it also replaces the images of a skill."
PLG_SYSTEM_GSSAIIMAGE_STYLE_PROMPT_LABEL="Additional style direction"
PLG_SYSTEM_GSSAIIMAGE_STYLE_PROMPT_DESC="Added after the chosen style, for every category."
PLG_SYSTEM_GSSAIIMAGE_AVOID_LABEL="Also avoid"
PLG_SYSTEM_GSSAIIMAGE_AVOID_DESC="Added after the avoid list of the chosen style."
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_NOTE_LABEL="Picture idea"
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_NOTE_DESC="A language model reads the article first and proposes one clear visual metaphor for the image model. The image then shows the point of the article instead of illustrating its words. With an uploaded skill, the language model writes the prompt by that skill."
PLG_SYSTEM_GSSAIIMAGE_USE_CONCEPT_LABEL="Write a picture idea first"
PLG_SYSTEM_GSSAIIMAGE_USE_CONCEPT_DESC="When off, a summary of the article goes straight to the image model. With an uploaded skill, the skill itself is handed to the image model, which usually gives weaker results."
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_PROVIDER_LABEL="Service for the idea"
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_PROVIDER_DESC="Same as image uses the service that draws the image."
PLG_SYSTEM_GSSAIIMAGE_CONCEPT_PROVIDER_SAME="Same as image"
PLG_SYSTEM_GSSAIIMAGE_OPENAI_TEXT_MODEL_LABEL="OpenAI language model"
PLG_SYSTEM_GSSAIIMAGE_GEMINI_TEXT_MODEL_LABEL="Gemini language model"
PLG_SYSTEM_GSSAIIMAGE_TEXT_MODEL_DESC="The language model that writes the picture idea."
PLG_SYSTEM_GSSAIIMAGE_MAX_CONTENT_LABEL="Article text limit"
PLG_SYSTEM_GSSAIIMAGE_MAX_CONTENT_DESC="The most characters of article text sent to the model."

; Native
PLG_SYSTEM_GSSAIIMAGE_NATIVE_ADMIN_LABEL="Administrator article form"
PLG_SYSTEM_GSSAIIMAGE_NATIVE_ADMIN_DESC="Show the AI button in the administrator article form."
PLG_SYSTEM_GSSAIIMAGE_NATIVE_SITE_LABEL="Site article form"
PLG_SYSTEM_GSSAIIMAGE_NATIVE_SITE_DESC="Show the AI button in the site article form."
