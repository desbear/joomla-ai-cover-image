; Layers
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_FIELDS="Image field settings"
PLG_SYSTEM_GSSAIIMAGE_FIELDSET_FIELDS_DESC="Second layer: image fields. Give single image fields their own ratio, maximum width and extra prompt. They override the defaults on the Output and Visual style tabs, and are overridden by category rules. The order is: defaults, image field, category, the editor's changes in the panel. What is left empty keeps the layer below. Extra prompts do not replace each other: the image field's and the category's both apply."
PLG_SYSTEM_GSSAIIMAGE_FIELD_RULES_LABEL="Image fields"
PLG_SYSTEM_GSSAIIMAGE_FIELD_RULES_DESC="Checked from top to bottom. When a field appears in several rows, the first one is used."
PLG_SYSTEM_GSSAIIMAGE_FIELD_NAMES_LABEL="Field names"
PLG_SYSTEM_GSSAIIMAGE_FIELD_NAMES_DESC="The image fields this row applies to, separated by commas. The intro image is image_intro and the full article image is image_fulltext. For custom fields and FLEXIcontent fields use the name of the field, for example og_image. The panel shows the name of the current field under Settings in use."
PLG_SYSTEM_GSSAIIMAGE_FIELD_PROMPT_DESC="Direction that images in this field must also follow, for example: For sharing on social media, keep the subject in the centre."
PLG_SYSTEM_GSSAIIMAGE_RULE_FIELDS_LABEL="Image fields it applies to"
PLG_SYSTEM_GSSAIIMAGE_RULE_FIELDS_DESC="Leave empty for every image field. With field names, the rule applies to those fields only, separated by commas. For example, when the OG image needs a fixed ratio, add another rule for og_image only."
