; Open WebUI
PLG_SYSTEM_GSSAIIMAGE_PROVIDER_OPENWEBUI="Open WebUI"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_NOTE_LABEL="Open WebUI"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_NOTE_DESC="Uses the image and language models of an Open WebUI server you host yourself. Its administrator must first enable image generation under Admin Settings, Images, and connect an image service there (OpenAI, Gemini, ComfyUI, Automatic1111 and others). Sending reference images and revising an image need Open WebUI 0.6.35 or later."
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_BASE_URL_LABEL="Server address"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_BASE_URL_DESC="The address of Open WebUI, for example https://ai.example.com. An address with /api/v1 works too. The key is sent to this address only."
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_KEY_LABEL="Open WebUI API key"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_KEY_DESC="Create one in Open WebUI under Settings, Account, API keys. The account needs permission to generate images. The key stays on the server and is never sent to the browser."
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_IMAGE_MODEL_DESC="The id of an image model the Open WebUI administrator set up. Leave empty for the server's default image model. Note: images made from a prompt alone always use the model set on the server. The model given here applies only when reference images are sent or an image is revised."
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_TEXT_MODEL_LABEL="Language model"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_TEXT_MODEL_DESC="The language model that writes the picture idea, by its id in the Open WebUI model list, for example gpt-4o-mini. When empty, no picture idea is written and a summary of the article goes straight to the image model."
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_DELETE_LABEL="Delete the file on the server after fetching"
PLG_SYSTEM_GSSAIIMAGE_OPENWEBUI_DELETE_DESC="Open WebUI keeps every generated image among the files of the account the key belongs to. When on, the plugin deletes that file after fetching the image, so drafts do not pile up."
PLG_SYSTEM_GSSAIIMAGE_ERR_PROVIDER_DENIED="%s does not let this key use this feature. The account may lack permission to generate images, or the server has it switched off. Tell the site administrator."
PLG_SYSTEM_GSSAIIMAGE_ERR_NO_EDIT="This image service does not allow revising an image. Choose New composition and try again."
PLG_SYSTEM_GSSAIIMAGE_ERR_NO_TEXT_MODEL="No language model is set."
PLG_SYSTEM_GSSAIIMAGE_NOTICE_IMAGES_IGNORED="This image service could not take the reference images this time. The image was made without them."

